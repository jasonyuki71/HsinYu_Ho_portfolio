<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
</head>
<body>
    <h1>Contact</h1>
    <p>Welcome to my page! You can reach me via email at jasonyuki71@gmail.com.</p>
    <form action="mailto:jasonyuki71@gmail.com"
        method="POST"
        enctype="text/plain">

    <label>
        Email:
        <input type="email" name="email">
    </label>

    <label>
        Subject:
        <input name="subject">
    </label>

    <label>
        Message:
        <textarea name="body" rows="5"></textarea>
    </label>

    <button>Send</button>
</form>
</body>
</html>
